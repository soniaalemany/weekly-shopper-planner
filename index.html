<!doctype html>
<html lang="es" class="h-full">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planificador semanal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{sage:{50:'#f3f8f4',100:'#e4f0e7',600:'#39735b',700:'#2d5d49'},ink:'#24302b'}}}}</script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="min-h-full bg-slate-50 text-ink">
  <header class="site-header border-b border-slate-200 bg-white/90 shadow-sm backdrop-blur">
    <div class="mx-auto flex max-w-7xl flex-col gap-3 px-5 py-4 sm:flex-row sm:items-center sm:justify-between">
      <a class="flex items-center gap-2 text-lg font-extrabold tracking-tight text-sage-700" href="/"><span class="grid h-9 w-9 place-items-center rounded-xl bg-sage-100">🍽️</span>Planificador</a>
      <nav class="site-nav flex gap-1 text-sm font-semibold text-slate-500">
        <a class="rounded-lg bg-sage-50 px-3 py-2 text-sage-700" href="/" aria-current="page">Planificador</a>
        <a class="rounded-lg px-3 py-2 hover:bg-slate-100" href="/recipes.html">Recetas</a>
        <a class="rounded-lg px-3 py-2 hover:bg-slate-100" href="/shopping.html">Compra</a>
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-7xl px-5 py-8 sm:py-12">
    <section class="mb-8 flex flex-col gap-5 lg:flex-row lg:items-end lg:justify-between">
      <div><h1 class="text-3xl font-black tracking-tight sm:text-4xl">Menú semanal</h1></div>
      <div class="week-controls flex flex-wrap items-center gap-2 rounded-2xl border border-slate-200 bg-white p-2 shadow-sm"><button id="previous-week" class="secondary rounded-xl px-3 py-2" aria-label="Semana anterior">←</button><input id="week-picker" class="rounded-xl border-0 bg-slate-50 px-3 py-2 text-sm font-semibold outline-none ring-sage-100 focus:ring-2" type="date" aria-label="Seleccionar semana (fecha de inicio)"><button id="next-week" class="secondary rounded-xl px-3 py-2" aria-label="Semana siguiente">→</button></div>
    </section>
    <p id="plan-status" class="mb-4 min-h-6 text-sm font-semibold text-sage-700" role="status"></p>
    <section id="week-grid" class="week-grid" aria-live="polite"></section>
  </main>
  <script src="/app.js?v=11"></script>
</body>
</html>
