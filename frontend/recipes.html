<!doctype html>
<html lang="es" class="h-full"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Recetas</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{sage:{50:'#f3f8f4',100:'#e4f0e7',600:'#39735b',700:'#2d5d49'},ink:'#24302b'}}}}</script><link rel="stylesheet" href="/css/styles.css"></head>
<body class="min-h-full bg-slate-50 text-ink">
<header class="site-header border-b border-slate-200 bg-white/90 shadow-sm"><div class="mx-auto flex max-w-7xl flex-col gap-3 px-5 py-4 sm:flex-row sm:items-center sm:justify-between"><a class="flex items-center gap-2 text-lg font-extrabold text-sage-700" href="/"><span class="grid h-9 w-9 place-items-center rounded-xl bg-sage-100">🍽️</span>Planificador</a><nav class="site-nav flex gap-1 text-sm font-semibold text-slate-500"><a class="rounded-lg px-3 py-2 hover:bg-slate-100" href="/">Planificador</a><a class="rounded-lg bg-sage-50 px-3 py-2 text-sage-700" href="/recipes.html" aria-current="page">Recetas</a><a class="rounded-lg px-3 py-2 hover:bg-slate-100" href="/shopping.html">Compra</a></nav></div></header>
<main class="mx-auto max-w-5xl px-5 py-8 sm:py-12"><section class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between"><div><p class="mb-2 text-sm font-bold uppercase tracking-widest text-sage-600">Tu biblioteca</p><h1 class="text-3xl font-black tracking-tight sm:text-4xl">Recetas</h1><p class="mt-2 text-slate-500">Guarda tus platos y consulta cuándo los cocinaste.</p></div><button id="new-recipe" class="rounded-xl bg-sage-600 px-5 py-3 font-bold text-white shadow-sm hover:bg-sage-700" aria-label="Añadir receta" title="Añadir receta">+</button></section>
<section id="recipe-form-wrap" class="panel hidden"><form id="recipe-form"><input type="hidden" id="recipe-id"><label>Nombre<input id="recipe-name" required></label><label>Descripción<textarea id="recipe-description" rows="2"></textarea></label><div class="form-heading"><strong>Ingredientes</strong><button type="button" id="add-ingredient" class="secondary small" aria-label="Añadir ingrediente" title="Añadir ingrediente">+</button></div><div id="ingredients"></div><div class="actions"><button type="submit">Guardar receta</button><button type="button" id="cancel-recipe" class="secondary">Cancelar</button></div></form></section>
<div class="mb-5 flex flex-wrap items-center gap-3 rounded-2xl border border-sage-100 bg-sage-50 p-4"><label class="text-sm font-semibold text-sage-700" for="import-file">Importar catálogo JSON</label><input id="import-file" type="file" accept="application/json" class="max-w-full text-sm text-slate-600"><button id="import-data" class="secondary small" type="button">Cargar datos</button></div><p id="recipe-status" class="mb-4 min-h-6 text-sm font-semibold text-sage-700" role="status"></p><section id="recipes" class="card-list"></section></main><script src="/js/recipes.js?v=4"></script></body></html>
